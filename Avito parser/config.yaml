# =====================================================================
#  Настройки бота скупки iPhone на Авито.
#  Здесь можно менять всё без правки кода. После правки файла отправьте
#  боту в Telegram команду /reload (или перезапустите бота).
#  Секреты (токены, ID таблицы) лежат не здесь, а в файле .env
# =====================================================================

# РЕЖИМ ПРОБНОГО ЗАПУСКА.
# true  — бот всё делает, но продавцам НЕ пишет, только присылает вам
#         «[DRY RUN] отправил бы …». Начните с этого режима минимум на сутки.
# false — боевой режим, бот реально пишет продавцам.
dry_run: true

timezone: "Europe/Moscow"

# ---------------------------------------------------------------- поиск
search:
  # Ссылка на поиск. Москва, мобильные телефоны, запрос «iphone»,
  # s=104 — сортировка «по дате», user=1 — только частные объявления.
  # Можно настроить фильтры на сайте Авито и вставить сюда свою ссылку.
  search_url: "https://www.avito.ru/moskva/telefony/mobilnye_telefony?q=iphone&s=104&user=1"
  check_interval_sec: 60      # пауза между проверками выдачи
  check_jitter_sec: 15        # + случайные 0..15 секунд
  known_streak_stop: 5        # встретили 5 уже известных подряд — проход закончен
  max_new_per_pass: 15        # максимум новых карточек, открываемых за один проход

# -------------------------------------------------------------- фильтры
filters:
  min_sane_price: 5000              # цена ниже — «1 ₽», «договорная» и т. п.
  min_seller_reviews: 1             # меньше отзывов — отбрасываем
  max_seller_active_listings: 5     # больше объявлений у продавца — перекуп

  # Слова, которые означают запчасти / неисправность / подделку.
  # Как ищется слово: короткие (до 3 букв) — только целым словом,
  # длинные — по началу слова («разбит» найдёт «разбитый», «разбито»).
  # Если перед словом стоит «не», «без» или «нет» — это не считается
  # («не разбит», «без ремонта»).
  stop_words:
    - на запчасти
    - запчаст
    - разбит
    - трещин
    - не включается
    - не работает
    - не заряжается
    - icloud
    - айклауд
    - залочен
    - блокировк
    - заблокирован
    - без face id
    - face id не работает
    - нет face id
    - не работает face id
    - после воды
    - утоплен
    - ремонт
    - копия
    - реплика
    - муляж
    - чехол для
    - коробка от

  # Фразы-исключения: вырезаются из текста ДО поиска стоп-слов,
  # чтобы нормальные объявления не отсеивались.
  stop_word_exceptions:
    - icloud чист
    - чистый icloud
    - отвязан от icloud
    - отвязан от айклауд
    - выйду из icloud
    - выйду из айклауд
    - выход из icloud
    - без привязки к icloud
    - не был в ремонте
    - в ремонте не был
    - никогда не был в ремонте
    - не ремонтировался
    - копия чека
    - копию чека
    - не залочен
    - без блокировок

  # Слова магазинов и перекупов (ищутся в описании и заголовке)
  shop_words:
    - магазин
    - гарантия магазина
    - trade-in
    - трейд-ин
    - рассрочк
    - в наличии все модели
    - опт
    - оптом
    - в кредит

# --------------------------------------------------------------- цены
pricing:
  # ID таблицы и имя листа можно задать здесь или в .env (в .env приоритетнее)
  worksheet: "Лист1"
  refresh_sec: 300            # перечитывать таблицу раз в 5 минут
  # Если Google Таблица не настроена (GOOGLE_SHEET_ID пустой), цены берутся
  # из этого CSV-файла (удобно для первой проверки).
  local_csv: "prices_example.csv"

  auto_write_max_pct: 25      # до +25% к цене скупки — бот пишет сам
  notify_max_pct: 40          # +25..+40% — только уведомление вам
  hot_discount: 0             # 🔥 горячее: предлагаем «цена − скидка» (0 = соглашаемся на цену продавца)
  offer_round_to: 500         # округление предложения вниз до 500 ₽

# ---------------------------------------------------------- переписка
messaging:
  work_hours_start: 9         # автописьма только с 9:00 ...
  work_hours_end: 22          # ... до 22:00 по Москве
  daily_message_limit: 30     # не больше 30 автосообщений в сутки
  send_pause_min_sec: 30      # пауза между любыми отправками 30..120 секунд
  send_pause_max_sec: 120
  reply_check_interval_sec: 90  # как часто проверять ответы продавцов
  dialog_active_days: 7         # следить за диалогами не старше 7 дней

  # Шаблоны первого сообщения. Подстановки: {model} {memory} {offer}
  templates:
    - "Здравствуйте! Интересует ваш {model} {memory}. Готов забрать сегодня за {offer} ₽, наличными или переводом. Удобно?"
    - "Добрый день! Рассматриваете {offer} ₽ за {model}? Могу подъехать в удобное вам время."
    - "Здравствуйте, ещё продаёте {model} {memory}? Предлагаю {offer} ₽, заберу быстро."
    - "Добрый день! Готов купить {model} за {offer} ₽. Если устраивает — договоримся о встрече."
    - "Здравствуйте! Могу предложить за {model} {memory} {offer} ₽, деньги сразу при встрече."

# ----------------------------------------------- разбор ответов продавцов
replies:
  agree_words:
    - да
    - согласен
    - согласна
    - договорились
    - ок
    - окей
    - ok
    - давайте
    - приезжайте
    - забирайте
    - можно
    - устраивает
    - пойдет
    - подходит
    - норм
  refuse_words:
    - нет
    - не отдам
    - мало
    - без торга
    - торга нет
    - не интересно
    - неинтересно
    - продан
    - уже продал
    - не актуально
    - неактуально
    - не договоримся
    - дешево не отдам
  counter_min_amount: 1000    # число от 1000 — это сумма торга

# --------------------------------------------- капча, ошибки, браузер
protection:
  captcha_recheck_sec: 30           # как часто проверять, пройдена ли капча
  captcha_remind_min: 30            # напоминать о капче раз в 30 минут
  network_retries: 3                # повторы при сетевой ошибке
  notify_after_failed_passes: 5     # после 5 неудачных проходов подряд — сообщить
  empty_page_alert_passes: 3        # 0 объявлений 3 раза подряд — «Авито изменил вёрстку»

browser:
  profile_dir: "data/browser_profile"
  navigation_timeout_sec: 45
